# Local SQS (elasticmq). Queue names are wired to the services via env
# (config.aws.*Sqs.queueName). FIFO queues match the real matching pipeline.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}
rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
}
queues {
  "matching-engine.fifo"  { fifo = true, contentBasedDeduplication = false }
  "cancel-order.fifo"     { fifo = true, contentBasedDeduplication = false }
  "sell-order.fifo"       { fifo = true, contentBasedDeduplication = false }
  # distribution-engine's own pollers (SQS_QUEUE_URL / MARKET_EVENT_QUEUE_URL in
  # drivers/secrets-stub). Without these it logs QueueDoesNotExist on a loop.
  "distribution-sqs.fifo" { fifo = true, contentBasedDeduplication = false }
  "market-events-queue"   { }
}
